[project]
name = "educore"
authors = [
    { name = "Izipo", email = "dev@izipo.health" },
]
description = "University management on Frappe: institution, academics, students, finance, HR and campus"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
education = ">=16.0.0,<17.0.0"
