[project]
name = "educore_theme"
authors = [
    { name = "Izipo", email = "dev@izipo.health" },
]
description = "EduCore look for Frappe: login page, logos, favicon and colours, overridable per university"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
